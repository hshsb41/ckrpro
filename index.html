<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd6e4">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<link rel="preconnect" href="https://ckrpro.onrender.com">
<link rel="preconnect" href="https://free-fire-glory-bot-ckr-and-bbc-web.vercel.app">
<title>Free Fire</title>

<style>
:root {
    --bg: #ffd6e4;
    --card: #fff1f5;
    --pink: #ffb3cb;
    --red: #e5252f;
    --ink: #4a0f23;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    -webkit-text-size-adjust: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
}

@supports (min-height: 100dvh) {
    body { min-height: 100dvh; }
}

.card {
    width: 100%;
    max-width: 300px;
    padding: 8px;
    border-radius: 28px;
    background: var(--card);
    animation: rise .5s cubic-bezier(.2, .7, .2, 1) backwards;
}

.item {
    display: flex;
    align-items: center;
    padding: 10px 14px 10px 10px;
    border-radius: 21px;
    text-decoration: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    transition: transform .15s ease;
}

.item + .item {
    margin-top: 6px;
}

.item:active {
    transform: scale(.98);
}

.item:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
}

.hot {
    background: var(--red);
    color: #fff;
}

.cool {
    background: var(--pink);
    color: var(--ink);
}

.icon {
    flex: none;
    width: 50px;
    height: 50px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.hot .icon {
    background: rgba(74, 15, 35, .22);
}

.cool .icon {
    background: var(--red);
}

.icon svg {
    width: 28px;
    height: 28px;
    fill: none;
    stroke: #fff;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.icon .soft {
    fill: #fff;
    fill-opacity: .25;
}

.icon .solid {
    fill: #fff;
    stroke: none;
}

.text {
    flex: 1;
    min-width: 0;
    margin-left: 13px;
}

.title {
    display: block;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.4px;
    line-height: 1.15;
}

.sub {
    display: block;
    margin-top: 3px;
    font-size: 12px;
    font-weight: 500;
}

.hot .sub {
    color: rgba(255, 255, 255, .78);
}

.cool .sub {
    color: rgba(74, 15, 35, .72);
}

.chev {
    flex: none;
    width: 18px;
    height: 18px;
    margin-left: 8px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: .7;
}

@keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .item { transition: none; }
}
</style>
</head>

<body>

<main class="card">

    <a class="item hot" href="https://ckrpro.onrender.com/" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <path d="M12 8V5.2"/>
                <circle class="solid" cx="12" cy="4" r="1.4"/>
                <rect class="soft" x="4.5" y="8" width="15" height="12" rx="4.5"/>
                <path d="M2.5 13v3.5M21.5 13v3.5"/>
                <circle class="solid" cx="9" cy="13.2" r="1.5"/>
                <circle class="solid" cx="15" cy="13.2" r="1.5"/>
                <path d="M9.5 16.9h5"/>
            </svg>
        </span>
        <span class="text">
            <span class="title">Free Fire Bot</span>
            <span class="sub">Open the bot</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>

    <a class="item cool" href="https://free-fire-glory-bot-ckr-and-bbc-web.vercel.app/" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <path class="soft" d="M7.5 3.5h9v6a4.5 4.5 0 0 1-9 0v-6z"/>
                <path d="M7.5 5.5H4.8a.8.8 0 0 0-.8.8v.7a3.5 3.5 0 0 0 3.6 3.5M16.5 5.5h2.7a.8.8 0 0 1 .8.8v.7a3.5 3.5 0 0 1-3.6 3.5"/>
                <path d="M12 14v3"/>
                <rect class="soft" x="8.5" y="17" width="7" height="3.5" rx="1.2"/>
                <path d="M7 20.5h10"/>
                <path class="solid" d="M12 6l.9 1.8 2 .3-1.45 1.4.35 2-1.8-.95-1.8.95.35-2L9.1 8.1l2-.3z"/>
            </svg>
        </span>
        <span class="text">
            <span class="title">Free Fire Glory</span>
            <span class="sub">Open Glory</span>
        </span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </a>

</main>

</body>
</html>
